name: Production Deployment to AWS EC2

on:
  push:
    branches:
      - main
      - master
  workflow_dispatch:

concurrency:
  group: deploy-${{ github.ref_name }}
  cancel-in-progress: false

jobs:
  deploy:
    name: Deploy to AWS EC2
    runs-on: ubuntu-latest

    steps:
      - name: Deploy to EC2 Server via SSH
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.EC2_HOST }}
          username: ${{ secrets.EC2_USERNAME }}
          key: ${{ secrets.EC2_SSH_KEY }}
          script: |
            set -e

            # 1. Target directory check
            TARGET_DIR="${{ secrets.EC2_TARGET_DIR }}"
            if [ -z "$TARGET_DIR" ]; then
              echo "Error: EC2_TARGET_DIR secret is not set." >&2
              exit 1
            fi

            echo "Navigating to $TARGET_DIR..."
            cd "$TARGET_DIR"

            # 2. Verify git repository
            if ! git rev-parse --is-inside-work-tree > /dev/null 2>&1; then
              echo "Error: Directory $TARGET_DIR is not a git repository." >&2
              exit 1
            fi

            # 3. Pull latest code for the triggered branch
            BRANCH="${{ github.ref_name }}"
            echo "Deploying triggered branch: $BRANCH"
            
            git fetch origin "$BRANCH"
            git checkout "$BRANCH"
            git pull origin "$BRANCH"

            # 4. Detect Docker Compose version (v2 vs v1)
            if command -v docker &> /dev/null && docker compose version &> /dev/null; then
              COMPOSE_CMD="docker compose"
            elif command -v docker-compose &> /dev/null; then
              COMPOSE_CMD="docker-compose"
            else
              echo "Error: Neither 'docker compose' nor 'docker-compose' is installed/available on EC2." >&2
              exit 1
            fi

            echo "Using Compose binary: $COMPOSE_CMD"

            # 5. Rebuild and restart production containers
            $COMPOSE_CMD -f docker-compose.prod.yml up -d --build

            # 6. Cleanup dangling Docker images to preserve EC2 disk space
            docker image prune -f

            echo "Successfully deployed $BRANCH to AWS EC2!"
