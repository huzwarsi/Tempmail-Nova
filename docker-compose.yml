version: '3.8'

services:
  # MongoDB Database
  mongodb:
    image: mongo:6.0
    container_name: tempmail-mongo
    restart: always
    ports:
      - "27017:27017"
    environment:
      MONGO_INITDB_DATABASE: tempmail
    volumes:
      - mongo-data:/data/db

  # Redis Cache & BullMQ Queue
  redis:
    image: redis:7-alpine
    container_name: tempmail-redis
    restart: always
    ports:
      - "6379:6379"
    volumes:
      - redis-data:/data

  # Node.js Express Server & SMTP Intake Engine
  server:
    build:
      context: .
      dockerfile: Dockerfile.server
    container_name: tempmail-backend-server
    restart: always
    ports:
      - "5000:5000"
      - "25:2525" # SMTP MX Intake Port Mapping (Host Port 25 -> Container 2525)
    environment:
      - PORT=5000
      - SMTP_PORT=2525
      - MONGO_URI=mongodb://mongodb:27017/tempmail
      - REDIS_HOST=redis
      - REDIS_PORT=6379
      - NODE_ENV=production
      - JWT_SECRET=production_super_secret_tempmail_key_2026
    depends_on:
      - mongodb
      - redis

  # React Frontend (Nginx Reverse Proxy)
  client:
    build:
      context: .
      dockerfile: Dockerfile.client
    container_name: tempmail-frontend-nginx
    restart: always
    ports:
      - "80:80"
      - "443:443"
    depends_on:
      - server

volumes:
  mongo-data:
  redis-data:
