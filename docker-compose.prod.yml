version: '3.8'

# ============================================================
# TempMail Production Docker Compose
# Deploy on Ubuntu VPS with:  docker-compose -f docker-compose.prod.yml up -d --build
# ============================================================

services:

  # ── MongoDB (or use Atlas URI in .env) ────────────────────
  mongodb:
    image: mongo:7.0
    container_name: tempmail-mongo
    restart: always
    environment:
      MONGO_INITDB_DATABASE: tempmail
    volumes:
      - mongo-data:/data/db
    networks:
      - tempmail-net

  # ── Redis for BullMQ + Socket.io adapter ──────────────────
  redis:
    image: redis:7-alpine
    container_name: tempmail-redis
    restart: always
    command: redis-server --save 60 1 --loglevel warning
    volumes:
      - redis-data:/data
    networks:
      - tempmail-net

  # ── Haraka SMTP Server (Port 25 — real MX receiver) ───────
  haraka:
    build:
      context: .
      dockerfile: Dockerfile.haraka
    container_name: tempmail-haraka
    restart: always
    ports:
      - "25:25"       # Real SMTP MX intake (requires root on host)
      - "587:587"     # Submission port (optional)
    environment:
      - EXPRESS_HOST=server
      - EXPRESS_PORT=5001
      - SMTP_INTERNAL_SECRET=${SMTP_INTERNAL_SECRET}
      - NODE_ENV=production
    depends_on:
      - server
    networks:
      - tempmail-net

  # ── Express API + Socket.io Server ────────────────────────
  server:
    build:
      context: .
      dockerfile: Dockerfile.server
    container_name: tempmail-server
    restart: always
    expose:
      - "5001"   # Internal only — Nginx proxies from 80/443
    environment:
      - PORT=5001
      - MONGO_URI=mongodb://mongodb:27017/tempmail
      - REDIS_HOST=redis
      - REDIS_PORT=6379
      - NODE_ENV=production
      - JWT_SECRET=${JWT_SECRET}
      - SMTP_INTERNAL_SECRET=${SMTP_INTERNAL_SECRET}
      - FRONTEND_URL=${FRONTEND_URL}
      - DEFAULT_DOMAIN=${DEFAULT_DOMAIN}
      - MAX_INBOX_EXPIRATION_HOURS=${MAX_INBOX_EXPIRATION_HOURS}
    depends_on:
      - mongodb
      - redis
    networks:
      - tempmail-net

  # ── React Frontend + Nginx Reverse Proxy ──────────────────
  client:
    build:
      context: .
      dockerfile: Dockerfile.client
    container_name: tempmail-client
    restart: always
    ports:
      - "80:80"
      - "443:443"
    volumes:
      # Mount Let's Encrypt SSL certs
      - /etc/letsencrypt:/etc/letsencrypt:ro
      - ./nginx/tempmail.conf:/etc/nginx/conf.d/default.conf:ro
    depends_on:
      - server
    networks:
      - tempmail-net

volumes:
  mongo-data:
    driver: local
  redis-data:
    driver: local

networks:
  tempmail-net:
    driver: bridge
