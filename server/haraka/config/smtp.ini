[main]
; Haraka SMTP Server Configuration
listen=0.0.0.0:25
nodes=1
user=haraka
group=haraka
ignore_bad_plugins=true
smtp_greeting_host=mail.yourdomain.com

[headers]
max_received=100
max_header_lines=1000

[connection]
; Max message size: 25MB
max_data_bytes=26214400

[smtp]
; Allow incoming emails without authentication (MX receiver mode)
; This is correct — we are receiving email, not sending
banner=220 mail.yourdomain.com ESMTP TempMail Receiver

[tls]
; Set to true and provide certs for TLS support
key=/etc/ssl/haraka/privkey.pem
cert=/etc/ssl/haraka/fullchain.pem
