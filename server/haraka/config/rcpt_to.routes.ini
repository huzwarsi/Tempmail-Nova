; Haraka rcpt_to.routes plugin configuration
; This tells Haraka to accept mail for our domains
; and route it to our Express API

; Format: domain=host:port (where Express API listens)
; Leave as wildcard to accept ANY domain (recommended for disposable email)
[default]
host=127.0.0.1
port=5001

; Add each domain you own here:
; yourdomain.com=127.0.0.1:5001
; tmpbox.xyz=127.0.0.1:5001
