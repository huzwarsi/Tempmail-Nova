##############################################
# TempMail — Production Nginx Configuration (HTTP Mode for Testing)
##############################################

server {
    listen 80;
    server_name _;

    # ── Security Headers ──────────────────────────────────────────────────────
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-XSS-Protection "1; mode=block" always;
    add_header Referrer-Policy "no-referrer-when-downgrade" always;

    # ── Gzip Compression ──────────────────────────────────────────────────────
    gzip on;
    gzip_vary on;
    gzip_proxied any;
    gzip_types text/plain text/css application/json application/javascript text/xml application/xml;

    # ─────────────────────────────────────────────────────────────────────────
    # BLOCK: Internal SMTP bridge — must NEVER be publicly accessible
    # Haraka talks to Express directly inside Docker network; Nginx must block it
    # ─────────────────────────────────────────────────────────────────────────
    location /smtp/ {
        deny all;
        return 403;
    }

    # ── Proxy Socket.io WebSocket connections ─────────────────────────────────
    location /socket.io/ {
        proxy_pass http://server:5001/socket.io/;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "Upgrade";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_read_timeout 86400;
    }

    # ── Proxy REST API requests ───────────────────────────────────────────────
    location /api/ {
        proxy_pass http://server:5001/api/;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 60s;
    }

    # ── Root API Status Check ──────────────────────────────────────────────────
    location / {
        default_type application/json;
        return 200 '{"status":"success","message":"TempMail Backend API Server Running"}';
    }
}
