##############################################
# TempMail — Production Nginx Configuration
##############################################

map $http_upgrade $connection_upgrade {
    default upgrade;
    '' close;
}

# ── HTTP → HTTPS redirect ────────────────────────────────────────────────────
server {
    listen 80;
    server_name api.tempmailnova.com;
    return 301 https://$host$request_uri;
}

# ── HTTPS Server (SSL + WebSocket + API) ─────────────────────────────────────
server {
    listen 443 ssl;
    server_name api.tempmailnova.com;

    # ── SSL Certificates (Let's Encrypt) ─────────────────────────────────────
    ssl_certificate /etc/letsencrypt/live/api.tempmailnova.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/api.tempmailnova.com/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_ciphers HIGH:!aNULL:!MD5;

    # ── Security Headers ──────────────────────────────────────────────────────
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-XSS-Protection "1; mode=block" always;
    add_header Referrer-Policy "no-referrer-when-downgrade" always;
    add_header Access-Control-Allow-Origin "https://tempmailnova.com" always;

    # ── Gzip Compression ──────────────────────────────────────────────────────
    gzip on;
    gzip_vary on;
    gzip_proxied any;
    gzip_types text/plain text/css application/json application/javascript text/xml application/xml;

    # ─────────────────────────────────────────────────────────────────────────
    # BLOCK: Internal SMTP bridge — must NEVER be publicly accessible
    # ─────────────────────────────────────────────────────────────────────────
    location /smtp/ {
        deny all;
        return 403;
    }

    # ── Proxy Socket.io WebSocket connections ─────────────────────────────────
    location /socket.io/ {
        proxy_pass http://server:5001/socket.io/;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection $connection_upgrade;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 86400s;
        proxy_send_timeout 86400s;
    }

    # ── Proxy REST API requests ───────────────────────────────────────────────
    location /api/ {
        proxy_pass http://server:5001/api/;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 60s;
    }

    # ── Health Check ──────────────────────────────────────────────────────────
    location / {
        default_type application/json;
        return 200 '{"status":"success","message":"TempMail Backend API Server Running"}';
    }
}
